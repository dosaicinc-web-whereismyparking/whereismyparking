# ─────────────────────────────────────────────────────────────────────────────
# Nginx reverse proxy config for WhereIsMyParking App nodes (App-1, App-2)
# Place this at: /etc/nginx/sites-available/whereismyparking
# Enable with: ln -s /etc/nginx/sites-available/whereismyparking /etc/nginx/sites-enabled/
# ─────────────────────────────────────────────────────────────────────────────

upstream nextjs {
    # Next.js running inside Docker on port 3000
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;  # Accept all hostnames — Cloudflare terminates SSL, LB forwards HTTP

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml application/atom+xml image/svg+xml;

    # Next.js static assets — long cache, immutable
    location /_next/static/ {
        proxy_pass http://nextjs;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js image optimization
    location /_next/image {
        proxy_pass http://nextjs;
        proxy_cache_valid 200 1d;
    }

    # Health check — lightweight, no logging
    location /api/health {
        proxy_pass http://nextjs;
        proxy_read_timeout 5s;
        access_log off;
    }

    # Everything else → Next.js
    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffers 8 16k;
        proxy_buffer_size 32k;
    }
}
