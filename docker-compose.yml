version: '3.8'

services:
  supabase-db:
    image: supabase/postgres:15.1.1.78
    container_name: supabase-db
    restart: unless-stopped
    ports:
      - "54322:5432"
    volumes:
      - ./supabase/volumes/db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  supabase-auth:
    image: supabase/gotrue:v2.151.0
    container_name: supabase-auth
    restart: unless-stopped
    ports:
      - "9999:9999"
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      GOTRUE_DB_DRIVER: postgres
      # search_path=auth so GoTrue's unqualified `users` query resolves to
      # auth.users, NOT the app's public.users (which lacks an `aud` column and
      # otherwise causes "column users.aud does not exist" at runtime).
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres?sslmode=disable&search_path=auth
      # Pin GoTrue to the auth schema for its own tables.
      GOTRUE_DB_NAMESPACE: auth
      # The v2.151.0 image listens on :8081 by default; bind it to :9999 so the
      # "9999:9999" mapping (and the app's SUPABASE_AUTH_URL) actually reach it.
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "true"
      # Set to false in production so real SMS OTPs are sent via Fast2SMS/MSG91
      GOTRUE_SMS_AUTOCONFIRM: ${GOTRUE_SMS_AUTOCONFIRM:-true}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      # GOTRUE_SITE_URL = your public domain (e.g. https://yourdomain.com)
      # API_EXTERNAL_URL = Supabase node private IP on Hetzner (e.g. http://10.0.0.3:54321)
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL:-http://localhost:3000}
      API_EXTERNAL_URL: ${SUPABASE_API_URL:-http://localhost:54321}
      GOTRUE_API_EXTERNAL_URL: ${SUPABASE_API_URL:-http://localhost:54321}

  supabase-rest:
    image: postgrest/postgrest:v12.0.2
    container_name: supabase-rest
    restart: unless-stopped
    ports:
      - "54321:3000"
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres?sslmode=disable
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      # Connection pool size. Increase for higher concurrency.
      # Default is 10 — too low for 500 concurrent users.
      PGRST_DB_POOL: ${PGRST_DB_POOL:-25}

  supabase-storage:
    image: supabase/storage-api:v0.43.12
    container_name: supabase-storage
    restart: unless-stopped
    ports:
      - "54324:5000"
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@supabase-db:5432/postgres?sslmode=disable
      FILE_SIZE_LIMIT: 5242880
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: parking-assets
      TENANT_ID: stub
      AWS_ACCESS_KEY_ID: stub
      AWS_SECRET_ACCESS_KEY: stub
      FILE_PATH: /var/lib/storage
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      REGION: local
    volumes:
      - ./supabase/volumes/storage:/var/lib/storage

  supabase-studio:
    image: supabase/studio:latest
    container_name: supabase-studio
    restart: unless-stopped
    ports:
      - "54323:3000"
    depends_on:
      supabase-rest:
        condition: service_started
      supabase-db:
        condition: service_healthy
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      SUPABASE_URL: ${SUPABASE_API_URL:-http://localhost:54321}
      SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      STUDIO_DEFAULT_ORGANIZATION: Local
      STUDIO_DEFAULT_PROJECT: WhereIsMyParking

  supabase-meta:
    image: supabase/postgres-meta:v0.75.0
    container_name: supabase-meta
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

volumes:
  supabase-db:
  supabase-storage:
